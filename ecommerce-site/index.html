<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopEase – Online Store</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
  <a class="logo" href="#">Shop<span>Ease</span></a>
  <input id="search" type="search" placeholder="Search products…" aria-label="Search products">
  <button id="cartBtn" class="cart-btn" aria-label="Open cart">🛒 Cart <span id="cartCount">0</span></button>
</header>

<section class="hero">
  <h1>Great products, great prices</h1>
  <p>Free shipping on orders over $50.</p>
</section>

<main>
  <div class="toolbar">
    <div id="categories" class="categories" role="group" aria-label="Categories"></div>
    <select id="sort" aria-label="Sort products">
      <option value="">Sort: Featured</option>
      <option value="asc">Price: Low to High</option>
      <option value="desc">Price: High to Low</option>
      <option value="rating">Top Rated</option>
    </select>
  </div>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>No products found.</p>
</main>

<div id="overlay" class="overlay" hidden></div>
<aside id="cart" class="cart" aria-label="Shopping cart" aria-hidden="true">
  <div class="cart-head"><h2>Your Cart</h2><button id="closeCart" aria-label="Close cart">✕</button></div>
  <div id="cartItems" class="cart-items"></div>
  <div class="cart-foot">
    <div class="row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
    <div class="row"><span>Shipping</span><strong id="shipping">$0.00</strong></div>
    <div class="row total"><span>Total</span><strong id="total">$0.00</strong></div>
    <button id="checkout" class="primary">Checkout</button>
  </div>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer class="footer">© 2025 ShopEase. Demo store – no real payments.</footer>
<script src="app.js"></script>
</body>
</html>
